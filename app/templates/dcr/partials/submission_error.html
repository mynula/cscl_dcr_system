<div id="submission-error-banner" class="rounded-2xl bg-red-50 border border-red-200 p-5 shadow-sm text-red-900 transition-all animate-shake">
  <div class="flex items-start justify-between">
    <div class="flex items-start space-x-3.5">
      <div class="p-2 rounded-xl bg-red-600 text-white flex-shrink-0 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <div>
        <h3 class="text-base font-bold text-red-900 leading-tight">
          Failed to Submit DCR Record
        </h3>
        <p class="text-xs text-red-700 mt-1">
          {{ error_message }}
        </p>
      </div>
    </div>

    <button 
      type="button" 
      onclick="this.closest('#submission-error-banner').remove()" 
      class="text-red-400 hover:text-red-700 p-1 rounded-lg hover:bg-red-100 transition-colors"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</div>
