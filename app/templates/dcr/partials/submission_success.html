<div id="submission-success-banner" class="rounded-2xl bg-emerald-50 border border-emerald-200 p-5 shadow-sm text-emerald-900 transition-all animate-fadeIn">
  <div class="flex items-start justify-between">
    <div class="flex items-start space-x-3.5">
      <div class="p-2 rounded-xl bg-emerald-600 text-white flex-shrink-0 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <div>
        <h3 class="text-base font-bold text-emerald-900 leading-tight">
          {{ message }}
        </h3>
        <p class="text-xs text-emerald-700 mt-1">
          Call report has been committed to the database and linked to your daily activity roster.
        </p>
        
        <!-- Summary pill info -->
        <div class="mt-3 flex flex-wrap gap-2 text-xs font-semibold">
          <span class="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800">
            DCR No: <strong class="font-mono">{{ dcr.dcr_number }}</strong>
          </span>
          <span class="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800">
            Doctor: {{ dcr.doctor_name }}
          </span>
          <span class="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800">
            Territory: {{ dcr.territory_name }}
          </span>
          <span class="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800">
            Date: {{ dcr.report_date }}
          </span>
        </div>
      </div>
    </div>

    <div class="flex items-center space-x-2 flex-shrink-0">
      <a href="/dcr/list" class="inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-bold text-emerald-800 bg-emerald-100 hover:bg-emerald-200 transition-colors">
        View In List &rarr;
      </a>
      <button 
        type="button" 
        onclick="this.closest('#submission-success-banner').remove()" 
        class="text-emerald-500 hover:text-emerald-700 p-1 rounded-lg hover:bg-emerald-100 transition-colors"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
</div>
