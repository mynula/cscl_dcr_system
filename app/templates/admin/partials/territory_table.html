<table class="min-w-full divide-y divide-slate-200 text-left text-xs">
  <thead class="bg-slate-50 text-slate-600 font-semibold uppercase tracking-wider">
    <tr>
      <th class="py-3 px-4">Code</th>
      <th class="py-3 px-4">Name</th>
      <th class="py-3 px-4">Region</th>
      <th class="py-3 px-4">Description</th>
      <th class="py-3 px-4">Status</th>
      <th class="py-3 px-4 text-right">Actions</th>
    </tr>
  </thead>
  <tbody class="divide-y divide-slate-100 text-slate-700">
    {% for t in territories %}
    <tr class="hover:bg-slate-50 transition-colors">
      <td class="py-3 px-4 font-mono font-bold text-brand-700">{{ t.code }}</td>
      <td class="py-3 px-4 font-semibold text-slate-900">{{ t.name }}</td>
      <td class="py-3 px-4 text-slate-600">{{ t.region }}</td>
      <td class="py-3 px-4 text-slate-500">{{ t.description or '-' }}</td>
      <td class="py-3 px-4">
        <span class="rounded-full px-2 py-0.5 text-[10px] font-bold {% if t.is_active %}bg-emerald-100 text-emerald-800{% else %}bg-slate-200 text-slate-700{% endif %}">{{ 'Active' if t.is_active else 'Inactive' }}</span>
      </td>
      <td class="py-3 px-4 text-right">
        <a href="/admin/territories/{{ t.id }}/edit" class="mr-2 text-brand-700 hover:underline font-semibold">Edit</a>
        <form method="post" action="/admin/territories/{{ t.id }}/active" hx-post="/admin/territories/{{ t.id }}/active" hx-target="#territory-table-container" hx-swap="innerHTML" class="inline">
          <input type="hidden" name="is_active" value="{{ 'false' if t.is_active else 'true' }}">
          <button class="mr-2 font-semibold {% if t.is_active %}text-amber-700{% else %}text-emerald-700{% endif %}">{{ 'Deactivate' if t.is_active else 'Activate' }}</button>
        </form>
        <button 
          hx-delete="/admin/territories/{{ t.id }}" 
          hx-confirm="Are you sure you want to delete territory {{ t.name }}?"
          hx-target="#territory-table-container"
          hx-swap="innerHTML"
          class="text-red-500 hover:text-red-700 font-semibold p-1 hover:bg-red-50 rounded"
        >
          Delete
        </button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
