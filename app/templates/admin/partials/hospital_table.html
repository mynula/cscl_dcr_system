<table class="min-w-full divide-y divide-slate-200 text-left text-xs">
  <thead class="bg-slate-50 text-slate-600 font-semibold uppercase tracking-wider">
    <tr>
      <th class="py-3 px-4">Code</th>
      <th class="py-3 px-4">Hospital Name</th>
      <th class="py-3 px-4">Type</th>
      <th class="py-3 px-4">Territory</th>
      <th class="py-3 px-4">Address / Phone</th>
      <th class="py-3 px-4 text-right">Actions</th>
    </tr>
  </thead>
  <tbody class="divide-y divide-slate-100 text-slate-700">
    {% for h in hospitals %}
    <tr class="hover:bg-slate-50 transition-colors">
      <td class="py-3 px-4 font-mono font-bold text-slate-700">{{ h.code }}</td>
      <td class="py-3 px-4 font-semibold text-slate-900">{{ h.name }}</td>
      <td class="py-3 px-4 text-slate-600">{{ h.type }}</td>
      <td class="py-3 px-4">
        <span class="px-2 py-0.5 rounded text-[11px] bg-slate-100 font-medium text-slate-800">
          {{ h.territory.name if h.territory else 'N/A' }}
        </span>
      </td>
      <td class="py-3 px-4 text-slate-500">{{ h.address or '-' }}</td>
      <td class="py-3 px-4 text-right">
        <button 
          hx-delete="/admin/hospitals/{{ h.id }}" 
          hx-confirm="Are you sure you want to delete {{ h.name }}?"
          hx-target="closest tr" 
          hx-swap="outerHTML" 
          class="text-red-500 hover:text-red-700 font-semibold p-1 hover:bg-red-50 rounded"
        >
          Delete
        </button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
