<table class="min-w-full divide-y divide-slate-200 text-left text-xs">
  <thead class="bg-slate-50 text-slate-600 font-semibold uppercase tracking-wider">
    <tr>
      <th class="py-3 px-4">Visit Type Name</th>
      <th class="py-3 px-4">Description</th>
      <th class="py-3 px-4">Status</th>
      <th class="py-3 px-4 text-right">Actions</th>
    </tr>
  </thead>
  <tbody class="divide-y divide-slate-100 text-slate-700">
    {% for v in visit_types %}
    <tr class="hover:bg-slate-50 transition-colors">
      <td class="py-3 px-4 font-bold text-slate-900">{{ v.name }}</td>
      <td class="py-3 px-4 text-slate-600">{{ v.description or '-' }}</td>
      <td class="py-3 px-4">
        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold {% if v.is_active %}bg-emerald-100 text-emerald-800{% else %}bg-slate-200 text-slate-700{% endif %}">
          {{ 'Active' if v.is_active else 'Inactive' }}
        </span>
      </td>
      <td class="py-3 px-4 text-right">
        <a href="/admin/visit-types/{{ v.id }}/edit" class="mr-2 text-brand-700 hover:underline font-semibold">Edit</a>
        <form method="post" action="/admin/visit-types/{{ v.id }}/active" hx-post="/admin/visit-types/{{ v.id }}/active" hx-target="#visit-type-table-container" hx-swap="innerHTML" class="inline">
          <input type="hidden" name="is_active" value="{{ 'false' if v.is_active else 'true' }}">
          <button class="mr-2 font-semibold {% if v.is_active %}text-amber-700{% else %}text-emerald-700{% endif %}">{{ 'Deactivate' if v.is_active else 'Activate' }}</button>
        </form>
        <button 
          hx-delete="/admin/visit-types/{{ v.id }}" 
          hx-confirm="Are you sure you want to delete {{ v.name }}?"
          hx-target="#visit-type-table-container"
          hx-swap="innerHTML"
          class="text-red-500 hover:text-red-700 font-semibold p-1 hover:bg-red-50 rounded"
        >
          Delete
        </button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
