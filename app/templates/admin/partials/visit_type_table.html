<table class="min-w-full divide-y divide-slate-200 text-left text-xs">
  <thead class="bg-slate-50 text-slate-600 font-semibold uppercase tracking-wider">
    <tr>
      <th class="py-3 px-4">Visit Type Name</th>
      <th class="py-3 px-4">Description</th>
      <th class="py-3 px-4">Status</th>
      <th class="py-3 px-4 text-right">Actions</th>
    </tr>
  </thead>
  <tbody class="divide-y divide-slate-100 text-slate-700">
    {% for v in visit_types %}
    <tr class="hover:bg-slate-50 transition-colors">
      <td class="py-3 px-4 font-bold text-slate-900">{{ v.name }}</td>
      <td class="py-3 px-4 text-slate-600">{{ v.description or '-' }}</td>
      <td class="py-3 px-4">
        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">
          Active
        </span>
      </td>
      <td class="py-3 px-4 text-right">
        <button 
          hx-delete="/admin/visit-types/{{ v.id }}" 
          hx-confirm="Are you sure you want to delete {{ v.name }}?"
          hx-target="closest tr" 
          hx-swap="outerHTML" 
          class="text-red-500 hover:text-red-700 font-semibold p-1 hover:bg-red-50 rounded"
        >
          Delete
        </button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
