{% extends "base.html" %}

{% block title %}Change Password - CSCL DCR System{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto py-8">
  <div class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm">
    <h1 class="text-xl font-bold text-slate-900">Change Password</h1>
    <p class="text-sm text-slate-500 mt-1">Use a unique password with at least 12 characters.</p>

    {% if error %}
    <div class="mt-5 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm" role="alert">
      {{ error }}
    </div>
    {% endif %}
    {% if success %}
    <div class="mt-5 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm" role="status">
      {{ success }}
    </div>
    {% endif %}

    <form action="/auth/change-password" method="POST" class="mt-6 space-y-5">
      <div>
        <label for="current_password" class="block text-sm font-semibold text-slate-700">Current password</label>
        <input id="current_password" name="current_password" type="password" autocomplete="current-password" required class="mt-1.5 block w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-900 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none">
      </div>
      <div>
        <label for="new_password" class="block text-sm font-semibold text-slate-700">New password</label>
        <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required class="mt-1.5 block w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-900 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none">
      </div>
      <div>
        <label for="confirm_password" class="block text-sm font-semibold text-slate-700">Confirm new password</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required class="mt-1.5 block w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-900 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none">
      </div>
      <button type="submit" class="w-full py-3 px-4 rounded-xl text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-4 focus:ring-brand-500/20">
        Update Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
