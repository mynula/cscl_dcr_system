{% extends "base.html" %}

{% block title %}Sign In - CSCL DCR System{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex flex-col justify-center items-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <img src="/static/images/company-logo.webp" alt="Concord Stem Cell" class="mx-auto h-20 w-auto max-w-full object-contain">
    <h2 class="mt-4 text-center text-2xl font-bold tracking-tight text-slate-900">
      CSCL DCR System
    </h2>
    <p class="mt-1 text-center text-sm text-slate-500">
      Field Force & Daily Call Report Portal
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-6 shadow-xl shadow-slate-200/50 sm:rounded-2xl border border-slate-100 sm:px-10">
      
      <!-- Error Alert Message -->
      {% if error %}
      <div class="mb-5 p-4 rounded-xl bg-red-50 border border-red-200 flex items-start space-x-3 text-red-700 text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="font-medium">{{ error }}</span>
      </div>
      {% endif %}

      <form action="/auth/login" method="POST" class="space-y-5">
        <div>
          <label for="username" class="block text-sm font-semibold text-slate-700">Username or ID</label>
          <div class="mt-1.5 relative">
            <input 
              id="username" 
              name="username" 
              type="text" 
              autocomplete="username" 
              required 
              placeholder="e.g. admin or marketer1"
              class="block w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-900 placeholder-slate-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 sm:text-sm transition-all outline-none"
            >
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-semibold text-slate-700">Password</label>
          <div class="mt-1.5 relative">
            <input 
              id="password" 
              name="password" 
              type="password" 
              autocomplete="current-password" 
              required 
              placeholder="••••••••"
              class="block w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-900 placeholder-slate-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 sm:text-sm transition-all outline-none"
            >
          </div>
        </div>

        <div class="pt-2">
          <button 
            type="submit" 
            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-4 focus:ring-brand-500/20 active:scale-[0.99] transition-all cursor-pointer"
          >
            Authenticate & Access DCR
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
{% endblock %}
